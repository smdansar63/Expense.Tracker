{% extends "base.html" %}

{% block title %}Set New Password - Personal Expense Tracker{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md mx-auto px-4 py-8">
    <div class="fintech-card p-6 sm:p-8 rounded-2xl shadow-xl relative">
        <!-- Back Button -->
        <a href="{{ url_for('login') }}" data-action="go-back" data-fallback="{{ url_for('login') }}" class="inline-flex items-center gap-2 text-xs font-medium text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 mb-6 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Login</span>
        </a>

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h2 class="text-2xl font-bold font-heading text-slate-900 dark:text-white">New Password</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Please enter and confirm your new secure password</p>
        </div>

        <!-- Form -->
        <form action="{{ url_for('reset_password', token=token) }}" method="POST" class="space-y-4">
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters" class="input-fintech !pl-9 !pr-10 text-sm">
                    <button type="button" data-action="toggle-password" data-target="password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">Confirm New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Repeat your new password" class="input-fintech !pl-9 !pr-10 text-sm">
                    <button type="button" data-action="toggle-password" data-target="confirm_password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full btn-primary !py-3 text-sm !rounded-xl shadow-lg shadow-indigo-500/25">
                    <span>Update Password</span>
                    <i class="fa-solid fa-check text-xs"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
